name: 内核构建 - ztc 5.10 + ReSukiSU + SUSFS

# ztc1997/android_gki_kernel_5.10_common 已归档；其 default 分支当前为
# android12-5.10-2025-09 (5.10.240)。构建流程仍在运行时解析 HEAD，并由
# checkout_kernel_source.sh 校验版本，避免 default 分支变化后产物被错标。

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_branch:
        description: "ReSukiSU 分支或 commit（留空使用 main）"
        required: false
        type: string
        default: "main"
      version:
        description: "自定义内核版本后缀"
        required: false
        type: string
        default: "-ztc-ReSukiSU-SUSFS"
      build_time:
        description: "自定义构建时间（N 或留空为当前 UTC）"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true

jobs:
  build-ztc-resukisu-susfs:
    name: "ztc default (5.10.240) + ReSukiSU + SUSFS"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "240"
      os_patch_level: "2025-09"
      revision: "r1"
      kernel_source_repo: "https://github.com/ztc1997/android_gki_kernel_5.10_common.git"
      kernel_source_ref: "HEAD"
      artifact_suffix: "-ztc"
      # ztc 官方衍生 workflow 使用 r563880，以支持其 MLGO regalloc 参数。
      clang_prebuilt_version: "clang-r563880"
      clang_archive_url: "https://github.com/zzh20188/ZTC-Kernel-Build/releases/download/clang/clang-r563880.tar.gz"
      clang_archive_sha256: "cf64c238acce155ab75ffe00e9b9a6d4007b3ffd0d31598e3275e40df6830743"
      ksu_variant: "ReSukiSU"
      ksu_branch: ${{ inputs.kernelsu_branch || 'main' }}
      version: ${{ inputs.version || '-ztc-ReSukiSU-SUSFS' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      use_bbg: false
      use_rekernel: false
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      enable_susfs: true
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
